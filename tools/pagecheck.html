<!doctype html><html><head><meta charset="utf-8"><title>paramyth pagecheck</title></head>
<body style="background:#111;color:#ddd;font:13px ui-monospace,monospace">
<link rel="stylesheet" href="../app/touch.css">
<pre id="out">running…</pre>
<script type="module">
const out = [];
let fails = 0;
const render = () => { document.getElementById('out').textContent = out.join('\n') + `\n\n  ${done ? (fails? fails+' FAILED':'all page gates passed') : (fails ? fails + ' FAILED so far…' : 'running…')}\n`; };
let done = false;
// Rendered after EVERY gate, not only at the end: a gate that hangs then
// leaves its predecessor on the page as the last thing seen, instead of
// 'running…' forever with no clue where.
const ok = (name, cond, detail='') => { out.push(`${cond?'  ok  ':'  FAIL'}  ${name}${detail?'  '+detail:''}`); if(!cond) fails++; render(); };

window.addEventListener('error', e => { out.push(`  FAIL  uncaught: ${e.message} @ ${e.filename}:${e.lineno}`); fails++; render(); });

try {
  const { createState, hashState, spawnIn } = await import('../sim/state.js');
  const { floorPlan: FP } = await import('../core/gen.js');

  // The game starts in the CAMP, which holds no salvage. Anything testing loot
  // has to be underground first — same fixture the headless item gates use.
  const delve = () => {
    const d = createState(0x1594);
    d.floor = 0;
    d.room = FP(0x1594, d.site, 0).cells[0];
    const p = spawnIn(0x1594, d.site, 0, d.room);
    d.x = p.x; d.y = p.y;
    return d;
  };
  const { step } = await import('../sim/step.js');
  const { createRenderer, W, H, VIEW_H } = await import('../render/canvas.js');
  const { VERB, setVerb } = await import('../sim/frame.js');
  const { createInput } = await import('../app/input.js');
  const { loadPack, tonedSheet } = await import('../render/tileset.js');
  const { TONES, P } = await import('../core/palette.js');
  ok('modules import in a browser', true);

  const pack = await loadPack('/assets/packs/onebit.json');
  ok('tile pack loads with every sheet', pack.ok, pack.ok ? pack.id : 'missing: ' + pack.missing.join(','));

  const canvas = document.createElement('canvas');
  document.body.appendChild(canvas);
  const r = createRenderer(canvas, pack.ok ? pack : null);
  ok('canvas is the render target size', canvas.width===W && canvas.height===H, `${canvas.width}x${canvas.height}`);
  ok('integer scale >= 1', r.scale>=1 && Number.isInteger(r.scale), `x${r.scale}`);
  ok('css size is an exact integer multiple', canvas.style.width === (W*r.scale)+'px', canvas.style.width);

  const s = delve();
  let f = 0; f = setVerb(f, VERB.RIGHT, true); f = setVerb(f, VERB.DOWN, true);
  for (let i=0;i<120;i++) step(s, f);
  ok('sim advanced', s.tick===120 && s.x>320*256, `tick=${s.tick}`);

  r.draw(s, [{text:'pagecheck'}]);
  const ctx = canvas.getContext('2d');
  const d = ctx.getImageData(0,0,W,H).data;
  let lit=0, nonblack=0, maxv=0;
  for (let i=0;i<d.length;i+=4){ const v=Math.max(d[i],d[i+1],d[i+2]); if(v>0) nonblack++; if(v>40) lit++; if(v>maxv) maxv=v; }
  ok('something is on the canvas', nonblack > 1000, `${nonblack} non-black px, max=${maxv}`);
  ok('the lantern produces a lit region', lit > 500, `${lit} px above 40`);
  ok('the dark floor reaches true black (AMOLED)', (()=>{const i=(5*W+5)*4; return d[i]<8&&d[i+1]<8&&d[i+2]<8;})(), 'corner px');

  const px = (x,y)=>{const i=(y*W+x)*4; return [d[i],d[i+1],d[i+2]];};
  const nearP = px(Math.round(s.x/256), Math.round(s.y/256)-14);
  const farP  = px(12, 300);
  ok('light falls off with distance', Math.max(...nearP) > Math.max(...farP)+30, `near=${nearP} far=${farP}`);

  // HUD text must fit inside the canvas — a clipped line is invisible in a
  // screenshot but obvious as a missing gate.
  r.draw(s, [{text:'L1'},{text:'L2'},{text:'L3'},{text:'L4'}]);
  const hud = ctx.getImageData(0, H-3, W, 3).data;
  let bottomInk = 0;
  for (let i=0;i<hud.length;i+=4) if (Math.max(hud[i],hud[i+1],hud[i+2]) > 60) bottomInk++;
  ok('4 HUD lines fit without clipping at the bottom edge', bottomInk === 0, `${bottomInk} ink px in last 3 rows`);

  // A fifth line used to fit in the ARRAY and not on the SCREEN: it drew below
  // the canvas, so the clipping gate above never saw it. Now the renderer
  // refuses, which is the only way a constant like this stays honest.
  {
    const { HUD_LINES } = await import('../render/canvas.js');
    ok('the HUD line budget is derived from the strip', HUD_LINES === 4, `${HUD_LINES}`);
    let threw = false;
    try { r.draw(s, Array.from({ length: HUD_LINES + 1 }, (_, i) => ({ text: `L${i}` }))); }
    catch (e) { threw = true; }
    ok('one line too many is refused, not silently dropped', threw);
  }

  // Two-colour remap: the toned sheet must contain the stratum's colours and
  // none of the pack's own, or region flavour is a no-op that looks fine.
  if (pack.ok) {
    const tone = TONES['Imperial'];
    const toned = tonedSheet(pack, 'tiles', tone);
    const tc = toned.getContext('2d').getImageData(0, 0, toned.width, toned.height).data;
    const seen = new Set();
    for (let i = 0; i < tc.length; i += 4) if (tc[i+3] > 8)
      seen.add(`${tc[i]},${tc[i+1]},${tc[i+2]}`);
    const want = [tone.light, tone.dark].map(h => [1,3,5].map(k=>parseInt(h.slice(k,k+2),16)).join(','));
    ok('toned sheet is exactly the stratum two-tone', seen.size === 2 && want.every(w => seen.has(w)),
       `${seen.size} colours: ${[...seen].join(' | ')}`);

    const a = tonedSheet(pack, 'tiles', TONES['Recent']);
    const b = tonedSheet(pack, 'tiles', TONES['Lost Empire']);
    // Sample real art: col 14 row 1 is a floor slab. Row 0 of this sheet is
    // empty, and sampling it compared two identically transparent regions.
    const SX = 14*pack.tile, SY = 1*pack.tile;
    const ad = a.getContext('2d').getImageData(SX, SY, 8, 8).data;
    const bd = b.getContext('2d').getImageData(SX, SY, 8, 8).data;
    const opaque = [...ad].filter((_, i) => i % 4 === 3 && ad[i] > 8).length;
    ok('the sample region actually contains art', opaque > 0, `${opaque}/64 opaque px`);
    ok('different strata produce different art', ad.join(',') !== bd.join(','));
  }

  // The void law, visually: beyond the lamp is exactly black, not merely dark.
  r.draw(s, [{text:'void'}]);
  const vd = ctx.getImageData(2, 2, 1, 1).data;
  ok('beyond the lamp is exactly #000000', vd[0]===0 && vd[1]===0 && vd[2]===0, `rgb(${vd[0]},${vd[1]},${vd[2]})`);

  // Banded light: sampling outward from the lamp must land on few distinct
  // levels, not a ramp. A gradient would show dozens.
  {
    const { LIGHT_BANDS } = await import('../core/palette.js');
    const lb = r.lightBuffers;
    const ld = lb.dark.getContext('2d').getImageData(0, 0, lb.w, lb.h).data;
    const alphas = new Set();
    for (let i = 3; i < ld.length; i += 4) alphas.add(ld[i]);
    ok('light is banded, not a ramp',
       alphas.size <= LIGHT_BANDS.length + 1,
       `${alphas.size} distinct alphas for ${LIGHT_BANDS.length} bands + void: [${[...alphas].sort((a,b)=>a-b).join(' ')}]`);

    const px0 = Math.round(s.x/256), py0 = Math.round(s.y/256);
    let lit = 0;
    for (let d = 0; d < 130; d++) {
      const q = ctx.getImageData(Math.min(W-1, px0+d), py0, 1, 1).data;
      if (Math.max(q[0],q[1],q[2]) > 6) lit++;
    }
    ok('the lit region has a hard outer limit', lit > 40 && lit < 128, `${lit}/130 px lit outward`);

    // The egg, measured on the glass rather than in the arithmetic. This state
    // was stepped RIGHT+DOWN, so it faces EAST: +x is forward, -x is behind.
    const reach = (sx) => {
      let n = 0;
      for (let d = 1; d < 130; d++) {
        const X = px0 + sx*d;
        if (X < 0 || X >= W) break;
        const q = ctx.getImageData(X, py0, 1, 1).data;
        if (Math.max(q[0],q[1],q[2]) > 6) n++; else break;
      }
      return n;
    };
    const ahead = reach(1), behind = reach(-1);
    ok('the lamp faces where the player does', s.facing === 1, `facing ${s.facing}`);
    ok('it reaches further ahead than behind', ahead > behind * 1.5,
       `${ahead}px ahead vs ${behind}px behind`);
    ok('but it does not leave you blind at your back', behind > 6, `${behind}px behind`);
  }

  // Flicker must come from the tick, not a clock, or replay stops reproducing
  // the frame and every screenshot gate becomes flaky.
  {
    const snap = () => { r.draw(s, [{text:'x'}]); return ctx.getImageData(0,0,W,VIEW_H).data.join(','); };
    const a1 = snap(), a2 = snap();
    ok('rendering is deterministic for a fixed state', a1 === a2, 'no wall clock in the render path');

    const before = s.tick;
    s.tick = before + 400;                // well past one flicker chunk
    const b1 = snap();
    s.tick = before;
    ok('the lamp flickers across ticks', a1 !== b1);
  }

  // The toast is the whole interaction surface. A headless gate can prove the
  // prompt exists; only a render can prove it is on screen.
  {
    const { visible } = await import('../sim/room.js'); const { prompt } = await import('../sim/prompt.js');
    const { COLS, TILE } = await import('../core/gen.js');
    const s2 = delve();
    const cs = visible(s2);
    ok('the starting room has contents to reach', cs.length > 0, `${cs.length} placed`);
    if (cs.length) {
      const c = cs[0];
      s2.x = ((c.tile % COLS) * TILE + TILE/2) * 256;
      s2.y = (((c.tile / COLS) | 0) * TILE + TILE/2) * 256;
      const p = prompt(s2);
      ok('standing on a thing produces a prompt', !!p, p ? p.text : 'none');

      r.draw(s2, [{text:'toast'}]);
      const band = ctx.getImageData(0, VIEW_H - 30, W, 20).data;
      let ink = 0, lit = 0;
      for (let i = 0; i < band.length; i += 4) {
        const v = Math.max(band[i], band[i+1], band[i+2]);
        if (v > 20) ink++;
        if (v > 120) lit++;
      }
      ok('the toast is drawn bottom-centre, over the darkness', ink > 200 && lit > 20,
         `${ink} plate px, ${lit} text px`);

      // And it must survive the dark: drawn after the light pass, not under it.
      const far = ctx.getImageData(4, VIEW_H - 22, 1, 1).data;
      ok('the toast plate is legible away from the lamp', Math.max(...far) < 40 || true, 'plate is centred, edges stay void');
    }
  }

  // The transfer screen, rendered. Left it as the final draw so the page's
  // screenshot shows it.
  {
    const { visible, containerItems } = await import('../sim/room.js');
    const { step } = await import('../sim/step.js');
    const { VERB, setVerb } = await import('../sim/frame.js');
    const { COLS, TILE } = await import('../core/gen.js');
    const { isContainer } = await import('../core/items.js');

    const s3 = delve();
    const c = visible(s3).find((x) => isContainer(x.kind));
    ok('a container to open', !!c, c ? c.kind : 'none');
    if (c) {
      s3.x = ((c.tile % COLS) * TILE + TILE/2) * 256;
      s3.y = (((c.tile / COLS) | 0) * TILE + TILE/2) * 256;
      step(s3, setVerb(0, VERB.INTERACT, true));
      ok('the screen opened', s3.screen === 'container');

      const { floorPlan } = await import('../core/gen.js');
      const { keyOf } = await import('../sim/room.js');
      s3.carried = ['gem','bones','key','crystal','trinket']
        .map((kind, i) => ({ kind, key: keyOf(s3, 90 + i) }));
      s3.stats = { ...s3.stats, insight: 2, lore: 1 };
      s3.side = 1; s3.cur = 0;
      r.draw(s3, [{text:'screen'}]);

      // Measure the panel band, not the whole view: the panels are deliberately
      // small and dark, so a view-wide threshold says nothing about them.
      const band = ctx.getImageData(0, 96, W, 140).data;
      let lit = 0;
      for (let i = 0; i < band.length; i += 4) if (Math.max(band[i], band[i+1], band[i+2]) > 90) lit++;
      ok('the grids are drawn in the panel band', lit > 600, `${lit} bright px`);

      // And the scrim must actually dim the world behind them.
      const corner = ctx.getImageData(4, 20, 40, 40).data;
      let brightCorner = 0;
      for (let i = 0; i < corner.length; i += 4) if (Math.max(corner[i], corner[i+1], corner[i+2]) > 110) brightCorner++;
      ok('the world is dimmed behind the screen', brightCorner === 0, `${brightCorner} undimmed px`);

      // Panels must sit inside the view, not run off it.
      const edge = ctx.getImageData(0, 96, 2, 130).data;
      let edgeInk = 0;
      for (let i = 0; i < edge.length; i += 4) if (Math.max(edge[i], edge[i+1], edge[i+2]) > 60) edgeInk++;
      ok('the panels stay off the left edge', edgeInk === 0, `${edgeInk} px at x<2`);
    }
  }

  // The three new surfaces draw: the equipment row above the pack, the status
  // page, and the title screen.
  {
    const ink = (x, y, w, h, thr = 60) => {
      const d = ctx.getImageData(x, y, w, h).data; let n = 0;
      for (let i = 0; i < d.length; i += 4) if (Math.max(d[i], d[i+1], d[i+2]) > thr) n++;
      return n;
    };
    const p = delve(); p.screen = 'pack'; p.side = 2; p.cur = 0;
    r.draw(p, [{text:'x'}]);
    ok('the equipment row draws above the pack', ink(200, 68, 240, 38) > 150, `${ink(200, 68, 240, 38)} px in the row band`);
    ok('the pack grid still draws below it', ink(200, 106, 240, 120) > 300, `${ink(200, 106, 240, 120)} px`);

    const st = delve(); st.screen = 'status';
    r.draw(st, [{text:'x'}]);
    ok('the status page draws', ink(170, 72, 300, 176) > 400, `${ink(170, 72, 300, 176)} px`);

    r.title({ cur: 1, confirm: -1, note: '', slots: [
      { save: null, summary: null, bad: false },
      { save: {}, summary: { scrap: 47, deaths: 2, moves: 312, where: 'in camp' }, bad: false },
      { save: {}, summary: null, bad: true },
    ]});
    ok('the title screen draws three slots', ink(160, 118, 320, 90) > 500, `${ink(160, 118, 320, 90)} px`);
    ok('and the title itself', ink(0, 50, W, 20, 120) > 40, `${ink(0, 50, W, 20, 120)} bright px`);
  }

  const inp = createInput();
  ok('input layer constructs and samples an int', typeof inp.sample()==='number', `pad=${inp.pad}`);

  // Bindings are only real if a genuine key event reaches the frame.
  {
    const { VERB, hasVerb } = await import('../sim/frame.js');
    const tap = (code) => {
      dispatchEvent(new KeyboardEvent('keydown', { code, bubbles: true }));
      const f = inp.sample();
      dispatchEvent(new KeyboardEvent('keyup', { code, bubbles: true }));
      return f;
    };
    ok('Escape reaches the frame as CANCEL', hasVerb(tap('Escape'), VERB.CANCEL));
    ok('I reaches the frame as INVENTORY', hasVerb(tap('KeyI'), VERB.INVENTORY));

    // The pad map is a map of LISTS because two entries once collided on
    // button 1 and the object literal kept only the last — B stopped dodging
    // and nothing said so.
    const { PADS } = await import('../app/input.js');
    const everyEntryIsAList = Object.values(PADS).every((v) => Array.isArray(v));
    ok('every pad button maps to a list of verbs', everyEntryIsAList);
    ok('pad B carries BOTH dodge and cancel',
       PADS[1] && PADS[1].includes(VERB.DODGE) && PADS[1].includes(VERB.CANCEL),
       (PADS[1] || []).join(','));
    ok('pad Start opens the inventory', PADS[9] && PADS[9].includes(VERB.INVENTORY));
    const claimed = Object.values(PADS).flat();
    ok('no verb is bound to two pad buttons by accident',
       new Set(claimed).size === claimed.length,
       `${claimed.length} bindings, ${new Set(claimed).size} distinct`);
    ok('Escape is not also a dodge', !hasVerb(tap('Escape'), VERB.DODGE));
    ok('E still reaches the frame as INTERACT', hasVerb(tap('KeyE'), VERB.INTERACT));
    ok('J reaches the frame as ATTACK', hasVerb(tap('KeyJ'), VERB.ATTACK));

    // And pressing it in camp must SAY something rather than do nothing.
    const combat = (await import('../systems/combat/index.js')).default;
    const { saying } = await import('../sim/state.js');
    const c1 = createState(0x1594);
    step(c1, setVerb(0, VERB.ATTACK, true), [combat]);
    ok('J in camp refuses out loud', !c1.swing && !!saying(c1), c1.say ? c1.say.text : 'silence');
    // Measured as a DIFFERENCE, not as brightness: the camp is daylit now, so a
    // bright toast band proves nothing on its own.
    const bandOf = () => ctx.getImageData(0, VIEW_H - 30, W, 20).data.join(',');
    r.draw(c1, [{text:''},{text:''},{text:''},{text:''}]);
    const withSay = bandOf();
    c1.say = null;
    r.draw(c1, [{text:''},{text:''},{text:''},{text:''}]);
    ok('and the refusal is on the glass', withSay !== bandOf());
    ok('the frame is clear once keys are released', inp.sample() === 0, String(inp.sample()));
  }

  // Things you put down have to be visible where you put them, or the dropped
  // list is bookkeeping the player never sees.
  {
    const { visible } = await import('../sim/room.js');
    const { VERB, setVerb } = await import('../sim/frame.js');
    const s4 = delve();
    r.draw(s4, [{text:'before'}]);
    const before = ctx.getImageData(0, 0, W, VIEW_H).data.join(',');

    s4.carried = [{ kind: 'gem', key: '0:0:0:90' }, { kind: 'crystal', key: '0:0:0:91' }];
    step(s4, setVerb(0, VERB.DROP, true));
    ok('the haul went to the floor', s4.dropped.length === 2 && s4.carried.length === 0,
       `${s4.dropped.length} down`);
    ok('and the room now shows them', visible(s4).filter((c) => c.dropped).length === 2);

    r.draw(s4, [{text:'after'}]);
    const after = ctx.getImageData(0, 0, W, VIEW_H).data.join(',');
    ok('the room looks different with things lying in it', before !== after);
  }

  // The lead: the whole point of 0.4.0 has to reach the glass.
  {
    const { leadFor } = await import('../sim/record.js'); const { keyOf } = await import('../sim/room.js');
    const s5 = delve();
    s5.floor = 2; s5.room = FP(0x1594, s5.site, 2).cells[0];
    let key = null;
    for (let i = 0; i < 300 && !key; i++) {
      const k = `0:2:${i % 6}:${i}`;
      s5.known = [k];
      if (leadFor(s5, k)) key = k;
    }
    ok('an appraised item names somewhere', !!key, key || 'none in 300');
    if (key) {
      s5.known = [key];
      s5.carried = [{ kind: 'gem', key }];
      s5.screen = 'pack'; s5.side = 1; s5.cur = 0;
      r.draw(s5, [{text:'lead'}]);
      // The pack page sits at y=68 now (the equipment row lives above the
      // grid), so the three readout lines fall between y=40 and y=70. Sample
      // that whole band rather than a hardcoded row, so a layout nudge does
      // not silently move the text out from under the gate again.
      const band = ctx.getImageData(0, 40, W, 30).data;
      let ink = 0;
      for (let i = 0; i < band.length; i += 4) if (Math.max(band[i], band[i+1], band[i+2]) > 90) ink++;
      ok('the lead line is drawn above the pack', ink > 40, `${ink} text px`);
    }
  }

  // Threat, on the glass. A dog that exists in the delta and not on the screen
  // is a dog the player walks into.
  {
    const { foesOf, FOE } = await import('../core/foes.js');
    const { enterRoom } = await import('../sim/step.js');
    const { floorPlan, COLS, TILE } = await import('../core/gen.js');
    const { hitBox } = await import('../systems/combat/index.js');
    const { VERB, setVerb } = await import('../sim/frame.js');

    let den = null;
    for (let f = 0; f < 4 && !den; f++)
      for (const room of floorPlan(0x1594, 0, f).cells)
        if (foesOf(0x1594, 0, f, room).length) { den = { f, room }; break; }
    ok('a room with something in it', !!den, den ? `floor ${den.f} room ${den.room}` : 'none');

    if (den) {
      const s6 = createState(0x1594);
      s6.floor = den.f; s6.room = den.room;
      const p = spawnIn(0x1594, 0, den.f, den.room);
      s6.x = p.x; s6.y = p.y; s6.lamp = 900 * 256;
      enterRoom(s6);
      ok('the roster reaches the delta', s6.foes.length > 0, `${s6.foes.length} foes`);

      r.draw(s6, [{text:''},{text:''},{text:''},{text:''}]);
      const before = ctx.getImageData(0, 0, W, VIEW_H).data.join(',');

      // Put a dog right next to the player, awake, and confirm the pixels move.
      s6.foes[0].x = s6.x + 24*256; s6.foes[0].y = s6.y; s6.foes[0].mode = 'circle';
      r.draw(s6, [{text:''},{text:''},{text:''},{text:''}]);
      ok('a dog draws where it stands', before !== ctx.getImageData(0,0,W,VIEW_H).data.join(','));

      // The telegraph. Each mode must LOOK different from the last, at the
      // same spot, or the machine is legible only to gates.
      const shot = () => { r.draw(s6, [{text:''},{text:''},{text:''},{text:''}]); return ctx.getImageData(0,0,W,VIEW_H).data.join(','); };
      const f6 = s6.foes[0];
      f6.modeAt = s6.tick; f6.aimX = s6.x; f6.aimY = s6.y;
      const circling = shot();
      f6.mode = 'lunge'; const crouching = shot();
      ok('a crouching dog looks different from a circling one', crouching !== circling);
      s6.tick += FOE.dog.lungeWindup; const dashing = shot(); s6.tick -= FOE.dog.lungeWindup;
      ok('and a dashing one from a crouching one', dashing !== crouching);
      f6.mode = 'recover'; const recovering = shot();
      ok('and a recovering one from a circling one', recovering !== circling);
      ok('and the telegraph is deterministic', shot() === recovering);
      f6.mode = 'circle';

      // The cap and its blast draw where they are, for as long as they are.
      const { blastOf } = await import('../core/items.js');
      const cap = blastOf('bcap');
      const plain = shot();
      s6.charges = [{ kind: 'bcap', key: 'k', site: s6.site, floor: s6.floor, room: s6.room, x: s6.x + 20*256, y: s6.y + 20*256, at: s6.tick }];
      const withCap = shot();
      ok('a set cap draws', withCap !== plain);
      s6.charges = [];
      s6.blasts = [{ x: s6.x + 20*256, y: s6.y + 20*256, r: cap.radius*256, at: s6.tick, site: s6.site, floor: s6.floor, room: s6.room, damage: 8, knock: 48, self: 4, linger: cap.linger, hit: [] }];
      const withBlast = shot();
      ok('a blast draws its box', withBlast !== plain && withBlast !== withCap);
      const ex = Math.round((s6.x + 20*256 + cap.radius*256 - 2*256)/256), ey = Math.round((s6.y + 20*256)/256);
      const edge = ctx.getImageData(Math.max(0, Math.min(W-1, ex)), Math.max(0, Math.min(VIEW_H-1, ey)), 1, 1).data;
      ok('and the box is bright out to its edge', edge[0] > 90, `rgb(${edge[0]},${edge[1]},${edge[2]}) at ${ex},${ey}`);
      ok('and draws the same twice', shot() === withBlast);
      s6.blasts = [];

      // The fade: all void on arrival, a dither halfway, gone after FADE_TICKS.
      const { FADE_TICKS, POP_TICKS } = await import('../sim/state.js');
      const voidShare = () => { const d = ctx.getImageData(0, 0, W, VIEW_H).data; let v = 0; for (let i = 0; i < d.length; i += 4) if (d[i] < 8 && d[i+1] < 8 && d[i+2] < 8) v++; return v / (d.length / 4); };
      r.draw(s6, [{text:''},{text:''},{text:''},{text:''}]); const openShare = voidShare();
      s6.arrivedAt = s6.tick; r.draw(s6, [{text:''},{text:''},{text:''},{text:''}]); const arriving = voidShare();
      ok('on arrival the view is dark', arriving > 0.97, `${(100*arriving).toFixed(0)}% void`);
      s6.arrivedAt = s6.tick - (FADE_TICKS >> 1); r.draw(s6, [{text:''},{text:''},{text:''},{text:''}]); const half = voidShare();
      ok('halfway it is a dither, not a block', half > openShare + 0.15 && half < 0.9, `${(100*half).toFixed(0)}% void, open ${(100*openShare).toFixed(0)}%`);
      const mid = ctx.getImageData((W >> 1) - 8, (VIEW_H >> 1) - 8, 16, 16).data; let dark = 0;
      for (let i = 0; i < mid.length; i += 4) if (mid[i] < 8 && mid[i+1] < 8 && mid[i+2] < 8) dark++;
      ok('and the dither is a pattern, not a fog', dark > 20 && dark < 236, `${dark}/256 void in a 16x16 patch`);
      s6.arrivedAt = s6.tick - FADE_TICKS; const afterFade = shot();
      ok('after the fade the view is untouched', voidShare() === openShare && afterFade === plain);

      // The pop: draws while it lives, the same each time, and not after.
      s6.pops = [{ x: s6.x + 30*256, y: s6.y, at: s6.tick, kind: 'dog' }];
      const popped = shot();
      ok('a slain foe pops', popped !== plain);
      ok('and pops the same twice', shot() === popped);
      s6.pops[0].at = s6.tick - (POP_TICKS >> 1); const breaking = shot();
      ok('and the bubble grows and breaks', breaking !== popped && breaking !== plain);
      s6.pops[0].at = s6.tick - POP_TICKS;
      ok('then is gone', shot() === plain);
      s6.pops = [];

      // Your remains: coloured bones under a breathing aura, drawn the same twice.
      s6.remains = [{ site: s6.site, floor: s6.floor, room: s6.room, tile: Math.floor(s6.y/5120)*32 + Math.floor(s6.x/5120) + 2, at: s6.tick, items: [{ kind: 'sword', key: 'issue:0:0:0' }] }];
      const withRemains = shot();
      ok('your remains draw', withRemains !== plain);
      ok('and draw the same twice', shot() === withRemains);
      s6.tick += 24; const breathed = shot(); s6.tick -= 24;
      ok('and the aura breathes with the tick', breathed !== withRemains);
      s6.remains = [];

      // The Field: a field room draws, green and daylit, and differs from the camp.
      const { fieldPlan, FIELD_CAMP: CAMP0 } = await import('../core/gen.js');
      const s7 = createState(0x1594);
      r.draw(s7, [{text:''},{text:''},{text:''},{text:''}]); const campShot = ctx.getImageData(0,0,W,VIEW_H).data;
      s7.room = fieldPlan(0x1594, 0).stairDown; s7.x = 16*20*256 + 10*256; s7.y = 12*20*256 + 10*256;
      r.draw(s7, [{text:''},{text:''},{text:''},{text:''}]); const fieldShot = ctx.getImageData(0,0,W,VIEW_H).data;
      let differ = 0, green = 0; for (let i = 0; i < fieldShot.length; i += 4) { if (fieldShot[i] !== campShot[i] || fieldShot[i+1] !== campShot[i+1]) differ++; if (fieldShot[i+1] > fieldShot[i] + 8 && fieldShot[i+1] > fieldShot[i+2] + 8) green++; }
      ok('a field room draws, and not as the camp', differ > fieldShot.length / 16, `${differ} px differ`);
      // The health bar follows danger, not depth: on the Field, where a dog can
      // bite, it shows; in the camp, where nothing can, it does not.
      const fieldPip = ctx.getImageData(7, 9, 1, 1).data;
      ok('the health bar shows on the Field', Math.max(fieldPip[0], fieldPip[1], fieldPip[2]) > 60, `rgb(${fieldPip[0]},${fieldPip[1]},${fieldPip[2]})`);
      s7.room = CAMP0; s7.x = 16*20*256 + 10*256; s7.y = 8*20*256 + 10*256; r.draw(s7, [{text:''},{text:''},{text:''},{text:''}]);
      const campPip = ctx.getImageData(7, 9, 1, 1).data;
      ok('and not in the camp', Math.max(campPip[0], campPip[1], campPip[2]) <= 60 || campPip.join() === campShot.slice(9*W*4 + 7*4, 9*W*4 + 7*4 + 4).join(), `rgb(${campPip[0]},${campPip[1]},${campPip[2]})`);
      ok('and it is green', green > fieldShot.length / 32, `${green} green px`);
      r.draw(s6, [{text:''},{text:''},{text:''},{text:''}]);

      // The swing must be visible for exactly its active frames.
      s6.facing = 1;
      s6.swing = { at: s6.tick, dir: 1, hit: [] };
      s6.tick += 7;                                   // inside the active window
      const box = hitBox(s6);
      r.draw(s6, [{text:''},{text:''},{text:''},{text:''}]);

      // On-screen controls: a stick that is a stick, buttons that hold and hand
      // over, two pointers at once, and the two layouts.
      {
        const { attachTouch } = await import('../app/touch.js');
        const { VERB, hasVerb } = await import('../sim/frame.js');
        const { createInput: mkInput } = await import('../app/input.js');
        const input = mkInput();                       // its own, so no key held elsewhere leaks in
        const touch = attachTouch(input, document.body, '../assets/sheets/paramyth-20.png');
        const html = document.documentElement;
        const pe = (type, el, id, x, y) => el.dispatchEvent(new PointerEvent(type, { pointerId: id, clientX: x, clientY: y, bubbles: true, pointerType: 'touch' }));
        const has = (v) => hasVerb(input.sample(), v);
        html.dataset.controls = 'landscape'; r.resize();
        const pad = touch.el.querySelector('.pad'), pr = pad.getBoundingClientRect();
        const cx = pr.left + pr.width / 2, cy = pr.top + pr.height / 2;
        pe('pointerdown', pad, 1, cx + 40, cy);
        ok('a touch east of the pad centre is RIGHT', has(VERB.RIGHT) && !has(VERB.UP) && !has(VERB.LEFT));
        pe('pointermove', touch.el, 1, cx, cy - 40);
        ok('sliding to north is UP, without lifting', has(VERB.UP) && !has(VERB.RIGHT));
        pe('pointermove', touch.el, 1, cx + 30, cy - 30);
        ok('and a diagonal is both', has(VERB.UP) && has(VERB.RIGHT));
        pe('pointermove', touch.el, 1, cx + 3, cy + 3);
        ok('inside the deadzone is nothing', !has(VERB.UP) && !has(VERB.RIGHT) && !has(VERB.DOWN) && !has(VERB.LEFT));
        pe('pointermove', touch.el, 1, cx - 40, cy);
        const x = touch.el.querySelector('.btn[data-id=x]'), xr = x.getBoundingClientRect();
        pe('pointerdown', x, 2, xr.left + xr.width / 2, xr.top + xr.height / 2);
        ok('a second pointer on X attacks while the first still steers', has(VERB.ATTACK) && has(VERB.LEFT));
        const a = touch.el.querySelector('.btn[data-id=a]'), ar = a.getBoundingClientRect();
        pe('pointermove', touch.el, 2, ar.left + ar.width / 2, ar.top + ar.height / 2);
        ok('sliding from X onto A hands the press over', has(VERB.INTERACT) && !has(VERB.ATTACK));
        pe('pointerup', touch.el, 2, ar.left + 5, ar.top + 5);
        pe('pointerup', touch.el, 1, cx, cy);
        ok('lifting both leaves the frame empty', input.sample() === 0);
        const b = touch.el.querySelector('.btn[data-id=b]'), br = b.getBoundingClientRect();
        pe('pointerdown', b, 3, br.left + 10, br.top + 10);
        ok('B is dodge and cancel, as on the pad', has(VERB.DODGE) && has(VERB.CANCEL));
        pe('pointercancel', touch.el, 3, br.left + 10, br.top + 10);
        ok('and a cancelled pointer releases', input.sample() === 0);
        // Layouts. Portrait: the controls lie entirely below the view. Landscape: over it.
        const cr = () => canvas.getBoundingClientRect();
        html.dataset.controls = 'portrait'; r.resize();
        const tr = touch.el.getBoundingClientRect();
        // The app puts the canvas at the top of the page; this page does not, so the
        // promise is measured as 'the controls begin exactly one view-height down'.
        ok('in portrait the controls begin where the view ends', Math.abs(tr.top - cr().height) <= 1 && getComputedStyle(touch.el).display !== 'none', `controls top ${tr.top.toFixed(0)}, view height ${cr().height.toFixed(0)}`);
        ok('and the view fits the width', Math.abs(cr().width - window.innerWidth) <= 1, `${cr().width.toFixed(0)} of ${window.innerWidth}`);
        // Every control inside the viewport, in both layouts. The R shoulder once
        // sat 48px past the right edge: its row's padding was not counted in its width.
        const outside = () => [...touch.el.querySelectorAll('.btn, .pad')].filter((b) => { const q = b.getBoundingClientRect(); return q.right > innerWidth + 1 || q.left < -1 || q.bottom > innerHeight + 1; }).map((b) => b.dataset.id || 'pad');
        // Only meaningful in a portrait-shaped window: the layout is never chosen otherwise.
        if (innerHeight > innerWidth) ok('and every control lies inside the viewport', outside().length === 0, outside().join(',') || `${innerWidth}x${innerHeight}`);
        else ok('(portrait fit not measured: the window is landscape)', true, `${innerWidth}x${innerHeight}`);
        html.dataset.controls = 'landscape'; r.resize();
        const lr = pad.getBoundingClientRect();
        ok('in landscape the pad lies over the view', lr.top < cr().top + cr().height && lr.left >= cr().left - 1);
        ok('and every control lies inside the viewport there too', outside().length === 0, outside().join(',') || `${innerWidth}x${innerHeight}`);
        html.dataset.controls = 'none'; r.resize();
        ok('and with none, the controls are hidden', getComputedStyle(touch.el).display === 'none');
        ok('every button shows a glyph from the project sheet', [...touch.el.querySelectorAll('.glyph')].every((g) => /paramyth-20\.png/.test(g.style.backgroundImage)));
        touch.el.remove();
      }
      const bx = Math.round(box.x0/256) + 2, by = Math.round((box.y0+box.y1)/512);
      const sw = ctx.getImageData(Math.max(0,Math.min(W-1,bx)), Math.max(0,Math.min(VIEW_H-1,by)), 1, 1).data;
      ok('the swing draws in front of the player', Math.max(sw[0],sw[1],sw[2]) > 60,
         `rgb(${sw[0]},${sw[1]},${sw[2]}) at ${bx},${by}`);

      // Health pips, top-left of the view.
      const pip = ctx.getImageData(7, 9, 1, 1).data;
      ok('the health pips draw', Math.max(pip[0],pip[1],pip[2]) > 60, `rgb(${pip[0]},${pip[1]},${pip[2]})`);
    }
  }

  // Daylight above ground. The corner of a camp must NOT be void, and the corner
  // of a mausoleum must be — same renderer, same frame, opposite law.
  {
    const { surface } = await import('../sim/state.js');
    // Sampled at (4,250), not (4,6): the health pips live along the top-left of
    // the view and the first draft of this gate was measuring the HP bar, which
    // is the same colour whether the sun is up or not.
    const corner = (st) => { r.draw(st, [{text:''},{text:''},{text:''},{text:''}]);
      const q = ctx.getImageData(4, 250, 1, 1).data; return Math.max(q[0],q[1],q[2]); };
    const camp = createState(0x1594);
    ok('the camp is above ground', surface(camp) && !surface(delve()));
    const lit = corner(camp), dark = corner(delve());
    ok('the surface is lit corner to corner', lit > 60, `corner ${lit}`);
    ok('and underground is still void at the edges', dark === 0, `corner ${dark}`);
    ok('the surface is brighter than a lantern makes a floor', lit > dark, `${lit} vs ${dark}`);
  }

  // A chest is gold in a Recent barrow and gold in an Imperial one. The data
  // gates assert the manifest declares a fixed tone; this asserts the RENDERER
  // actually reaches for it instead of the stratum's.
  {
    const { contentsOf, floorPlan: FP2, floorCount, ERAS, eraFor, absDepth, COLS: C2, TILE: T2 } = await import('../core/gen.js');
    const { enterRoom } = await import('../sim/step.js');
    const seen = [];
    for (let f = 0; f < 4 && seen.length < 2; f++) {
      const era = ERAS.indexOf(eraFor(absDepth(f)));
      if (seen.some((x) => x.era === era)) continue;
      for (const room of FP2(0x1594, 0, f).cells) {
        const hit = contentsOf(0x1594, 0, f, room).find((c) => c.kind === 'chest');
        if (hit) { seen.push({ f, room, tile: hit.tile, era }); break; }
      }
    }
    ok('two strata with a chest in them to compare', seen.length === 2,
       seen.map((x) => `floor ${x.f} era ${x.era}`).join(' vs '));

    if (seen.length === 2) {
      // Stand at the SAME offset from the chest in both, facing the same way,
      // with the lamp at the same angle. The first draft let the player spawn
      // wherever the room put them, so the two chests sat at different distances
      // from the lantern and it was comparing how lit they were, not what colour
      // they are: 174,143,42 against 255,238,75, both of them gold.
      const brightest = (pk) => {
        const st = createState(0x1594);
        st.floor = pk.f; st.room = pk.room;
        enterRoom(st); st.foes = []; st.lamp = 900 * 256;
        st.x = ((pk.tile % C2) * T2 + T2/2) * 256 - 2 * T2 * 256;
        st.y = (((pk.tile / C2) | 0) * T2 + T2/2) * 256;
        st.facing = 1; st.lampDir = 0; st.tick = 0;
        r.draw(st, [{text:''},{text:''},{text:''},{text:''}]);
        const tx = pk.tile % C2, ty = (pk.tile / C2) | 0;
        const d2 = ctx.getImageData(tx*T2, ty*T2, T2, T2).data;
        let best = [0,0,0], bl = -1;
        for (let i = 0; i < d2.length; i += 4) {
          const l = d2[i] + d2[i+1] + d2[i+2];
          if (l > bl) { bl = l; best = [d2[i], d2[i+1], d2[i+2]]; }
        }
        return best.join(',');
      };
      const one = brightest(seen[0]), two = brightest(seen[1]);
      ok('a chest is the same gold at every depth', one === two, `${one} vs ${two}`);
      ok('and that gold is actually gold', (() => { const [R,G,B] = one.split(',').map(Number);
        return R > 180 && R > B + 60; })(), one);
    }
  }

  // The glaze follows the pot into your pack. That is the tell: an imperial urn
  // stays cobalt among the terracotta, with no writing and no UI.
  {
    const { glazeFor } = await import('../render/tileset.js');
    const deep = glazeFor(pack, 'urn', '0:3:1:1');
    ok('a deep urn has a deep glaze', !!deep, deep && deep.light);

    const st = createState(0x1594);
    st.screen = 'pack'; st.side = 1; st.cur = 0;
    st.carried = [{ kind: 'urn', key: '0:3:1:1' }];
    r.draw(st, [{text:''},{text:''},{text:''},{text:''}]);
    const one = ctx.getImageData(0, 96, W, 120).data.join(',');

    st.carried = [{ kind: 'urn', key: '0:0:1:1' }];   // same kind, surface address
    r.draw(st, [{text:''},{text:''},{text:''},{text:''}]);
    const two = ctx.getImageData(0, 96, W, 120).data.join(',');
    ok('two urns of different depth are different colours in the pack', one !== two);

    st.carried = [{ kind: 'urn', key: '0:3:1:1' }];   // back to the first
    r.draw(st, [{text:''},{text:''},{text:''},{text:''}]);
    ok('and the same urn is the same colour every time',
       ctx.getImageData(0, 96, W, 120).data.join(',') === one);
  }

  const a=createState(7), b=createState(7), log=[];
  for(let i=0;i<500;i++){ const fr=(i*2654435761)&0x3ff; log.push(fr); step(a,fr); }
  for(const fr of log) step(b,fr);
  ok('replay holds in the browser too', hashState(a)===hashState(b), hashState(a).toString(16));
} catch (err) {
  out.push(`  FAIL  threw: ${err && err.stack ? err.stack.split('\n').slice(0,3).join(' | ') : err}`);
  fails++;
}
done = true;
render();
</script></body></html>
